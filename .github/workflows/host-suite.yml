name: Host suite

on:
  push:
    paths:
      - .github/workflows/host-suite.yml
      - apps/host/**
  pull_request:
    paths:
      - .github/workflows/host-suite.yml
      - apps/host/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux / npm test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (the lockfile, nothing optional)
        shell: bash
        run: npm ci --no-audit --no-fund
        working-directory: apps/host
      - name: Run the host suite
        shell: bash
        run: npm test
        working-directory: apps/host
